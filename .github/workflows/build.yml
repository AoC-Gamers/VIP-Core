name: VIP Core Build

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - "channel/*"
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: vip-core-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCEMOD_VERSION: "1.12"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl tar python3 make

      - name: Build SourceMod artifact
        run: bash ./scripts/ci-build-sourcemod.sh

      - name: Validate SourceMod artifact
        run: bash ./scripts/ci-validate-artifact.sh

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
          else
            version="pr-${GITHUB_SHA::7}"
          fi

          basename="vip-core-sourcemod-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "basename=${basename}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        env:
          RELEASE_BASENAME: ${{ steps.meta.outputs.basename }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: bash ./scripts/ci-package-release-assets.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/channel/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/release/${{ steps.meta.outputs.basename }}.zip
          draft: false
          prerelease: false
