name: VIP Core Build

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - "channel/*"
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: vip-core-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCEMOD_VERSION: "1.12"

jobs:
  deps-smx:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore SourceMod dependency cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: ${{ runner.os }}-smx-deps-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/fetch-sourcemod.py', 'Makefile') }}

      - name: Resolve SourceMod dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save SourceMod dependency cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build-smx:
    needs: deps-smx
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore SourceMod dependency cache
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: ${{ runner.os }}-smx-deps-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/fetch-sourcemod.py', 'Makefile') }}
          fail-on-cache-miss: true

      - name: Build SourceMod plugin
        run: make build-smx PYTHON=python3 SPCOMP="deps/sourcemod-linux/addons/sourcemod/scripting/spcomp"

      - name: Upload SourceMod build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload SourceMod compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: deps/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build-smx
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SourceMod release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SourceMod build tree
        uses: actions/download-artifact@v6
        with:
          name: smx-build
          path: .build/smx

      - name: Download SourceMod compile log
        uses: actions/download-artifact@v6
        with:
          name: smx-compile-log
          path: deps

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
            release_tag="channel/develop"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
            release_tag="channel/latest"
          else
            version="pr-${GITHUB_SHA::7}"
            release_tag=""
          fi

          basename="vip-core-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "basename=${basename}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Package SourceMod build tree
        run: make package-smx PYTHON=python3

      - name: Stage SourceMod artifact
        run: python3 ./scripts/stage-artifact.py . ./.build/package-smx ./deps/build-smx-compile.log

      - name: Validate SourceMod artifact
        run: bash ./scripts/ci-validate-artifact.sh

      - name: Create release archive
        env:
          RELEASE_BASENAME: ${{ steps.meta.outputs.basename }}
        run: make release PYTHON=python3 RELEASE_BASENAME="${RELEASE_BASENAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release asset
        if: steps.meta.outputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: dist/release/${{ steps.meta.outputs.basename }}.zip
          draft: false
          prerelease: false
