name: VIP Core Build

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - "channel/*"
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: vip-core-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Build VIP Core
        shell: bash
        run: |
          mkdir -p addons/sourcemod/plugins
          cd addons/sourcemod/scripting
          spcomp VIP_Core.sp -E -o ../plugins/VIP_Core.smx -i./include

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
          else
            version="pr-${GITHUB_SHA::7}"
          fi

          basename="vip-core-sourcemod-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "basename=${basename}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        shell: bash
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os
          import zipfile

          out_file = os.path.join("dist", "${{ steps.meta.outputs.basename }}.zip")
          entries = ["addons", "LICENSE", "README.md"]

          with zipfile.ZipFile(out_file, "w", zipfile.ZIP_DEFLATED) as zf:
              for entry in entries:
                  if not os.path.exists(entry):
                      continue
                  if os.path.isdir(entry):
                      for root, dirs, files in os.walk(entry):
                          dirs.sort()
                          files.sort()
                          rel_root = os.path.relpath(root, ".")
                          if not dirs and not files:
                              zf.writestr(rel_root.rstrip("/") + "/", "")
                          for name in files:
                              path = os.path.join(root, name)
                              arcname = os.path.relpath(path, ".")
                              zf.write(path, arcname)
                  else:
                      zf.write(entry, entry)
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/channel/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ steps.meta.outputs.basename }}.zip
          draft: false
          prerelease: false
